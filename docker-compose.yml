services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    # No `environment:` here on purpose: config comes from .env. A container-level
    # DB_DATABASE or APP_ENV would override phpunit.xml and point tests at the dev database.
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cosmetics_db
      MYSQL_USER: cosmetics
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

  queue:
    build: .
    profiles: ["workers"]
    command: php artisan queue:work --tries=1
    volumes:
      - .:/var/www/html
    depends_on:
      - app

  scheduler:
    build: .
    profiles: ["workers"]
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - app

volumes:
  db-data:
